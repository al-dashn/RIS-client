name: Build & Deploy SDK

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: dashn-website

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build UMD bundle
        run: |
          npm install --save-dev esbuild
          npx esbuild src/tracker.ts \
            --bundle --format=iife --global-name=DTSRIS \
            --outfile=dist-umd/dtsris-tracker.umd.js \
            --minify --target=es2020 --platform=browser

      - name: Verify bundle
        run: |
          echo "UMD size: $(wc -c < dist-umd/dtsris-tracker.umd.js) bytes"
          grep -q "DTSRIS" dist-umd/dtsris-tracker.umd.js && echo "✅ UMD valid" || exit 1

      - name: Upload UMD artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtsris-tracker-umd
          path: web/dist-umd/dtsris-tracker.umd.js

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy UMD to S3
        run: |
          aws s3 cp dist-umd/dtsris-tracker.umd.js \
            s3://$S3_BUCKET/js/dtsris-tracker.umd.js \
            --content-type text/javascript \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[?DomainName=='$S3_BUCKET.s3.$AWS_REGION.amazonaws.com']].Id" --output text)
          if [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/js/dtsris-tracker.umd.js"
          fi
