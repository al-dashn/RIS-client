name: Build & Release SDKs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── Web SDK ──
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build npm package
        run: npx tsc

      - name: Build UMD bundle
        run: node build-umd.mjs

      - name: Verify outputs
        run: |
          echo "npm dist:" && ls -la dist/
          echo "---"
          echo "UMD: $(wc -c < dist-umd/dtsris-tracker.umd.js) bytes"
          grep -q "DTSTracker" dist-umd/dtsris-tracker.umd.js && echo "✅ UMD valid" || (echo "❌ UMD broken" && exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-sdk
          path: |
            web/dist/
            web/dist-umd/

  # ── Android SDK ──
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android SDK
        run: |
          cd android
          ./gradlew :sdk:assembleRelease

  # ── Publish web SDK to npmjs.com on tag ──
  publish-web:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build:all
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Release on tag ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-sdk
          path: web/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web/dist-umd/dtsris-tracker.umd.js
          body: |
            ## DTS RIS Client SDKs — Release ${{ github.ref_name }}

            ### Web
            npm: `npm install @al-dashn/web-sdk@${{ github.ref_name }}`
            CDN bundle attached below.

            ### Android
            JitPack: `com.github.al-dashn:RIS-client:${{ github.ref_name }}`

            ### iOS
            SPM: tag `${{ github.ref_name }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
